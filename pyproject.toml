[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bplan-geography"
version = "0.2.1"
description = "Parse Network Rail's BPLAN Geography extract in Python: the UK rail network, TIPLOCs and sectional running times."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Dillon Rose", email = "dillonrose0@icloud.com" }]
keywords = ["bplan", "network-rail", "railway", "uk-rail", "tiploc", "sectional-running-times", "running-times", "rail-network", "timetable-planning", "great-britain", "open-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pandas>=2.0", "networkx>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "types-networkx"]

[project.scripts]
bplan-geography = "bplan_geography.cli:main"

[project.urls]
Homepage = "https://github.com/rosedillon/bplan-geography"
Documentation = "https://github.com/rosedillon/bplan-geography#readme"
Source = "https://github.com/rosedillon/bplan-geography"
Issues = "https://github.com/rosedillon/bplan-geography/issues"
Changelog = "https://github.com/rosedillon/bplan-geography/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
# PEP 8: code may run to 99 when agreed, but comments and docstrings
# still wrap at 72.
max-doc-length = 72

[tool.mypy]
strict = true
